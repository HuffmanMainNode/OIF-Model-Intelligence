[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oif-model-intelligence"
version = "0.1.0"
description = "Model-card validation and transparent local inference memory estimation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
oif-model-fit = "oif_model_intelligence.profile:main"

[tool.setuptools.packages.find]
where = ["src"]
